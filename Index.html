<style>
:root{
  color-scheme:light;
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#111A22; --ink2:#6B7682; --line:#E6E9ED;
  --accent:#1D4ED8; --accent-soft:#E8EEFC; --on-accent:#FFFFFF; --dark:#111A22; --on-dark:#FFFFFF;
  --ok:#15803D; --ok-soft:#E7F5EC; --warn:#A15C00; --warn-soft:#FFF4DC; --bad:#B42318; --bad-soft:#FDECEA;
  --scrim:rgba(17,26,34,.35);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;
  --bg:#0E1318; --card:#171D24; --ink:#EDF1F5; --ink2:#8C98A4; --line:#252D36;
  --accent:#6E9BFF; --accent-soft:#1A2640; --on-accent:#0E1318; --dark:#EDF1F5; --on-dark:#0E1318;
  --ok:#4ADE80; --ok-soft:#12291B; --warn:#F5B84A; --warn-soft:#2E230E; --bad:#FF8A80; --bad-soft:#3A1614; --scrim:rgba(0,0,0,.55);}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 8px}
.pm{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;flex:none}
.top b{font-size:17px;flex:1}
.top small{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.screen{flex:1;padding:8px 18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h2{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0;line-height:1.15}
.sub{color:var(--ink2);font-size:15px;margin:2px 0 0}
.lbl{font-size:13px;font-weight:600;color:var(--ink2);margin:0}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip small{font-weight:500;color:var(--ink2);font-size:12px}
.plate{display:inline-flex;align-items:stretch;height:24px;border-radius:4px;overflow:hidden;background:#F5C400;border:1.5px solid #111;color:#111;vertical-align:middle}
.plate i{width:11px;background:#1F4E9C}
.plate span{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;font-size:13px;letter-spacing:.05em;padding:0 6px;display:flex;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.inp:focus{border-color:var(--accent);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.dark{background:var(--dark);color:var(--on-dark)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:10px 14px;font-size:14px;border-radius:12px;width:auto;align-self:flex-start}
.note{font-size:13px;color:var(--ink2);text-align:center;margin:0}
.msg{border-radius:14px;padding:12px 14px;font-size:14px}
.msg b{display:block;margin-bottom:2px}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sel{appearance:none;-webkit-appearance:none;padding:10px 36px 10px 12px;font-size:15px;color:var(--ink);background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.lbl.drv{display:block;margin:10px 0 4px}
.cred{white-space:pre-wrap;word-break:break-all;background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;margin:8px 0 0;font:500 14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;user-select:all;-webkit-user-select:all}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:6px 12px;border-radius:99px;align-self:center}
.status.warn{color:var(--warn);background:var(--warn-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.timer{font-size:58px;font-weight:600;letter-spacing:-.02em;line-height:1;text-align:center;margin-top:18px}
.cost{font-size:18px;color:var(--ink2);text-align:center}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:18px;overflow:hidden}
.facts div{background:var(--card);padding:13px 15px;min-width:0}
.facts span{display:block;font-size:12.5px;color:var(--ink2)}
.facts b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.list{background:var(--card);border-radius:18px;padding:0 16px}
.item{display:flex;align-items:center;gap:12px;padding:13px 0}
.item + .item{border-top:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--ink2);margin-top:2px}
.item .a{font-weight:600;text-align:right;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--bg);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.empty{text-align:center;color:var(--ink2);padding:24px 8px;font-size:15px}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.total b{font-size:32px;font-weight:700;letter-spacing:-.02em}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}
.x{border:0;background:none;color:var(--ink2);font-weight:600;font-size:14px;padding:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-inner{max-width:560px;margin:0 auto;display:contents}
.tabs button{background:none;border:0;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs svg{width:23px;height:23px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--ok);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px;font-weight:700}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:8;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:21px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--dark);color:var(--on-dark);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:10;width:max-content;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.login{max-width:440px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 22px 24px;display:flex;flex-direction:column;gap:18px}
.login .brand{width:min(82%,340px);height:auto;align-self:center;margin:4px 0 6px}
.top .emb{height:30px;width:auto;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

// ---------- verbinding ----------
if (!window.supabase || !window.supabase.createClient) {
  document.getElementById('root').innerHTML = '<div class="login"><div class="msg bad"><b>De app kon niet laden</b>Controleer je internetverbinding en ververs de pagina.</div></div>';
  return;
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'hooiveld-parking-auth' } });

const S = {
  user: null, me: null, people: {}, vehicles: [], projects: [], sessions: [],
  tab: 'park', loading: true, err: '', period: 'week',
  form: { veh: null, proj: null, zone: '', rate: '', place: '' }, prefilled: false,
  busy: false, conflict: null, found: null, locMsg: '', channel: null,
};

// ---------- gegevens ----------
let loading = false, again = false;
async function load() {
  if (!S.user) return;
  if (loading) { again = true; return; }
  loading = true;
  try {
    const [p, v, pr, s] = await Promise.all([
      sb.from('profiles').select('id, full_name, role, removed_at'),
      sb.from('vehicles').select('id, plate, label, active, driver_id').order('label'),
      sb.from('projects').select('id, name, active').order('name'),
      sb.from('sessions').select('*').order('start_at', { ascending: false }).limit(2000),
    ]);
    const err = p.error || v.error || pr.error || s.error;
    if (err) throw err;
    S.people = {}; (p.data || []).forEach((x) => { S.people[x.id] = x; });
    S.me = S.people[S.user.id] || null;
    S.vehicles = v.data || []; S.projects = pr.data || [];
    S.sessions = (s.data || []).map((r) => ({ ...r, rate: Number(r.rate), est: r.est == null ? null : Number(r.est), paid: r.paid == null ? null : Number(r.paid) }));
    S.err = '';
  } catch (e) {
    S.err = 'Gegevens laden lukte niet. Controleer je internetverbinding.';
  } finally {
    S.loading = false; loading = false;
    render();
    if (again) { again = false; load(); }
  }
}
function subscribe() {
  if (S.channel) sb.removeChannel(S.channel);
  S.channel = sb.channel('hooiveld-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sessions' }, () => load())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'vehicles' }, () => load())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, () => load())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => load())
    .subscribe();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

const vehicles = () => S.vehicles.filter((v) => v.active);
const projects = () => S.projects.filter((p) => p.active);
const actives = () => S.sessions.filter((s) => s.status === 'active').sort((a, b) => ms(a.start_at) - ms(b.start_at));
const mine = () => S.user ? S.sessions.find((s) => s.status === 'active' && s.user_id === S.user.id) : null;
const name = (id) => id === S.user?.id ? 'Jij' : (S.people[id]?.full_name || 'Een collega');
const isAdmin = () => S.me?.role === 'admin';
// Monteur ziet en meldt alleen zijn eigen bus(sen) aan; de beheerder alle bussen.
const myVehicles = () => isAdmin() ? vehicles() : vehicles().filter((v) => v.driver_id === S.user?.id);
const members = () => Object.values(S.people).filter((p) => !p.removed_at).sort((a, b) => (a.full_name || '').localeCompare(b.full_name || ''));
const canStop = (s) => isAdmin() || s.user_id === S.user?.id || vehicles().some((v) => v.id === s.vehicle_id && v.driver_id === S.user?.id);
const driverName = (v) => v.driver_id ? (S.people[v.driver_id] && !S.people[v.driver_id].removed_at ? S.people[v.driver_id].full_name : 'onbekend') : '';
const amount = (s) => s.paid ?? s.est ?? 0;

function parkView() {
  const a = mine();
  if (a) return activeView(a);
  if (!vehicles().length || !projects().length) {
    return `<div><h2>Welkom</h2><p class="sub">${isAdmin() ? 'Voeg eerst je bussen en projecten toe. Daarna kan het team parkeren registreren.' : 'Kantoor moet eerst bussen en projecten toevoegen.'}</p></div>${isAdmin() ? '<button class="btn" data-tab="beheer" id="goAdmin">Naar Beheer</button>' : ''}`;
  }
  if (!myVehicles().length) {
    return `<div><h2>${greet()}</h2><p class="sub">Er is nog geen bus aan jou gekoppeld.</p></div><div class="msg warn"><b>Vraag het aan kantoor</b>De beheerder koppelt in Beheer jouw bus aan jouw account. Daarna kun je hier parkeren registreren.</div>`;
  }
  const f = S.form;
  if (!S.prefilled) {
    S.prefilled = true;
    const last = S.sessions.find((s) => s.user_id === S.user.id);
    if (last) {
      if (myVehicles().some((v) => v.id === last.vehicle_id)) f.veh = last.vehicle_id;
      if (projects().some((p) => p.id === last.project_id)) f.proj = last.project_id;
      f.zone = last.zone; f.rate = toInp(last.rate); f.place = last.place || '';
    }
  }
  if (f.veh && !myVehicles().some((v) => v.id === f.veh)) f.veh = null;
  if (!f.veh && myVehicles().length === 1) f.veh = myVehicles()[0].id;
  const act = actives();
  const zones = []; for (const s of S.sessions) { if (!zones.some((z) => z.zone === s.zone)) zones.push({ zone: s.zone, rate: s.rate }); if (zones.length >= 5) break; }
  const rate = parseEur(f.rate); const ready = f.veh && f.proj && f.zone.trim() && rate !== null && !Number.isNaN(rate);
  const z = S.found;
  return `<div><h2>${greet()}</h2><p class="sub">Registreer waar je bus staat. Betaal daarna in je parkeerapp.</p></div>
  <div class="card"><p class="lbl">${isAdmin() ? 'Voertuig' : (myVehicles().length === 1 ? 'Jouw bus' : 'Jouw bussen')}</p><div class="chips">
    ${myVehicles().map((v) => { const by = act.find((s) => s.vehicle_id === v.id); return `<button class="chip" data-veh="${esc(v.id)}" aria-pressed="${f.veh === v.id}">${plate(v.plate)}<small>${esc(v.label)}${by ? ' · staat geparkeerd' : ''}</small></button>`; }).join('')}
  </div></div>
  <div class="card"><p class="lbl">Project</p><div class="chips">
    ${projects().map((p) => `<button class="chip" data-proj="${esc(p.id)}" aria-pressed="${f.proj === p.id}">${esc(p.name)}</button>`).join('')}
  </div></div>
  <div class="card">
    <button class="btn soft small" id="findZone">${S.locating ? 'Zone zoeken…' : 'Zone en tarief op mijn locatie'}</button>
    ${z ? `<p class="lbl" style="font-weight:500">${esc(z.municipality || '')} · zone ${esc(z.areaid)}${z.zone_name && z.zone_name !== z.areaid ? ` (${esc(z.zone_name)})` : ''} · ${eur(z.rate_per_hour)} eerste uur${z.paid_until ? ` · betaald tot ${hhmm(z.paid_until)}` : ''}${z.max_minutes ? ` · max. ${z.max_minutes} min` : ''}</p>` : ''}
    ${S.locMsg ? `<div class="msg warn">${esc(S.locMsg)}</div>` : ''}
    <div class="row2">
      <div class="field"><label class="lbl" for="fZone">Zonecode</label><input class="inp" id="fZone" autocomplete="off" autocapitalize="characters" placeholder="bijv. T13B" value="${esc(f.zone)}"></div>

function range(p) {
  const now = new Date(); const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7)); mon.setHours(0, 0, 0, 0);
  if (p === 'week') return [+mon, Infinity];
  if (p === 'lastweek') return [+mon - 7 * 864e5, +mon];
  if (p === 'month') return [+new Date(now.getFullYear(), now.getMonth(), 1), Infinity];
  if (p === 'lastmonth') return [+new Date(now.getFullYear(), now.getMonth() - 1, 1), +new Date(now.getFullYear(), now.getMonth(), 1)];
  return [0, Infinity];
}
function doneIn(p) { const [a, b] = range(p); return S.sessions.filter((s) => s.status === 'done' && ms(s.start_at) >= a && ms(s.start_at) < b); }

  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';

  return Array.from(r, (n) => abc[n % abc.length]).join('');
}

async function startParking(takeOver) {
  const f = S.form; const rate = parseEur(f.rate);
  if (S.busy || !f.veh || !f.proj || !f.zone.trim() || rate === null || Number.isNaN(rate)) return;
  const clash = actives().find((s) => s.vehicle_id === f.veh);
  if (clash && !takeOver) { S.conflict = clash; render(); return; }
  S.busy = true; S.formErr = ''; render();
  const { error } = await sb.rpc('start_session', { p_vehicle: f.veh, p_project: f.proj, p_zone: f.zone.trim(), p_rate: rate, p_place: f.place.trim(), p_take_over: !!takeOver });
  S.busy = false;
  if (error) { S.formErr = errText(error); if (String(error.message).includes('VEHICLE_BUSY')) await load(); render(); return; }
  S.conflict = null; S.found = null; S.locMsg = '';
  toast('Parkeren geregistreerd'); await load();
}

async function findZone() {
  if (!navigator.geolocation) { S.locMsg = 'Deze browser kan je locatie niet bepalen.'; render(); return; }
  S.locating = true; S.locMsg = ''; S.found = null; render();
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const { data, error } = await sb.rpc('zone_at', { p_lat: pos.coords.latitude, p_lon: pos.coords.longitude });
      if (error) throw error;
      const zones = (data || []).map((z) => ({ ...z, rate_per_hour: z.rate_per_hour == null ? null : Number(z.rate_per_hour) }));
      const z = zones.find((x) => x.paid_now && x.inside) || zones.find((x) => x.paid_now);
      if (z && z.rate_per_hour != null) {
        S.form.zone = z.areaid; S.form.rate = toInp(z.rate_per_hour); S.found = z;
        const others = zones.filter((o) => o.paid_now && o.areaid !== z.areaid && o.rate_per_hour !== z.rate_per_hour);
        S.locMsg = others.length ? `Je staat vlak bij een zonegrens. Kijk op het bord of het ook zone ${others[0].areaid} kan zijn.` : '';
      } else if (zones.length) {
        S.locMsg = `Hier hoef je nu niet te betalen${zones[0].municipality ? ` (${zones[0].municipality})` : ''}.`;
      } else {
        S.locMsg = 'Geen betaalde parkeerzone gevonden op deze plek. Controleer het bord.';
      }
    } catch (e) { S.locMsg = errText(e); }
    S.locating = false; render();
  }, (e) => {
    S.locating = false;
    S.locMsg = e && e.code === 1 ? 'Geef de website toegang tot je locatie (Instellingen → Safari → Locatie).' : 'Je locatie kon niet worden bepaald. Probeer het buiten nog eens.';
    render();
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}

async function addVeh() {

  if (!p) { S.adminErr = 'Vul een kenteken in.'; render(); return; }
  const { error } = await sb.from('vehicles').insert({ plate: p, label: l || `Bus ${vehicles().length + 1}` });
  S.adminErr = error ? (String(error.message).includes('vehicles_plate_active') || String(error.code) === '23505' ? 'Dit kenteken staat er al in.' : errText(error)) : '';
  if (!error) toast('Bus toegevoegd'); await load();
}
async function addProj() {
  const n = $('#nProj').value.trim();
  if (!n) { S.adminErr = 'Vul een projectnaam in.'; render(); return; }
  if (projects().some((p) => p.name.toLowerCase() === n.toLowerCase())) { S.adminErr = 'Dit project bestaat al.'; render(); return; }
  const { error } = await sb.from('projects').insert({ name: n });
  S.adminErr = error ? errText(error) : ''; if (!error) toast('Project toegevoegd'); await load();
}
async function removeItem(kind, id) {
  S.confirmRm = null;
  const { error } = await sb.from(kind).update({ active: false }).eq('id', id);
  S.adminErr = error ? errText(error) : ''; if (!error) toast('Verwijderd'); await load();
}
async function saveName() {
  const n = $('#myName').value.trim();
  const { error } = await sb.rpc('set_my_name', { p_name: n });
  if (error) { S.adminErr = errText(error); render(); } else { toast('Naam opgeslagen'); await load(); }
}
function downloadCsv() {
  const q = (v) => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
  const money = (n) => Number(n).toFixed(2).replace('.', ',');
  const d2 = (iso) => { const d = new Date(iso); return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}`; };
  const head = ['Datum', 'Start', 'Eind', 'Minuten', 'Kenteken', 'Bus', 'Project', 'Zone', 'Tarief per uur', 'Bedrag', 'Bron', 'Adres', 'Monteur'];
  const rows = doneIn(S.period).slice().reverse().map((s) => [d2(s.start_at), hm(s.start_at), s.end_at ? hm(s.end_at) : '', s.end_at ? Math.round((ms(s.end_at) - ms(s.start_at)) / 60000) : '',
    s.plate, s.vehicle_label, s.project_name, s.zone, money(s.rate), money(amount(s)), s.paid != null ? 'parkeerapp' : 'schatting', s.place, S.people[s.user_id]?.full_name || ''].map(q).join(';'));
  const csv = '﻿' + [head.map(q).join(';'), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `hooiveld-parkeerkosten-${S.period}-${d2(new Date().toISOString())}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function sheet(html) { $('#sheet').innerHTML = html; $('#sheet').classList.add('open'); $('#scrim').classList.add('open'); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); }

// ---------- gebeurtenissen ----------
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  const btn = $('#loginBtn'), er = $('#loginErr');
  const email = $('#email').value.trim().toLowerCase(), pw = $('#pw').value;
  if (!email || !pw) { er.hidden = false; er.textContent = 'Vul je e-mailadres en wachtwoord in.'; return; }
  btn.disabled = true; btn.textContent = 'Inloggen…'; er.hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { btn.disabled = false; btn.textContent = 'Inloggen'; er.hidden = false; er.textContent = errText(error); }
});
document.addEventListener('click', (e) => {
  if (e.target.id === 'scrim') { closeSheet(); return; }
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { S.tab = d.tab; S.adminErr = ''; S.formErr = ''; S.confirmRm = null; if (d.tab !== 'beheer') S.newMember = null; render(); window.scrollTo(0, 0); if (d.tab === 'beheer') loadEmails(); return; }
  if (d.veh) { S.form.veh = d.veh; S.conflict = null; render(); return; }
  if (d.proj) { S.form.proj = d.proj; render(); return; }
  if (d.rz != null) { const zs = []; for (const s of S.sessions) { if (!zs.some((z) => z.zone === s.zone)) zs.push({ zone: s.zone, rate: s.rate }); } const z = zs[+d.rz]; if (z) { S.form.zone = z.zone; S.form.rate = toInp(z.rate); render(); } return; }
  if (d.stop) { openStop(d.stop); return; }
  if (d.period) { S.period = d.period; render(); return; }
  if (d.rmask) { S.confirmRm = d.rmask; render(); return; }
  if (d.rmcancel) { S.confirmRm = null; render(); return; }
  if (d.rm) { removeItem(d.rm, d.id); return; }
  if (d.rmuser) { removeMember(d.rmuser); return; }
  if (d.pw) { newPassword(d.pw); return; }
  switch (b.id) {
    case 'startBtn': startParking(false); break;
    case 'takeOver': startParking(true); break;
    case 'cancelConflict': S.conflict = null; render(); break;
    case 'findZone': findZone(); break;
    case 'confirmStop': confirmStop(d.id, b); break;
    case 'closeSheet': closeSheet(); break;
    case 'csvBtn': downloadCsv(); break;
    case 'addVeh': addVeh(); break;
    case 'addProj': addProj(); break;
    case 'saveName': saveName(); break;
    case 'addMember': addMember(); break;
    case 'doneCred': S.newMember = null; render(); break;
    case 'shareCred': { const t = credText(S.newMember || {}); if (navigator.share) navigator.share({ text: t }).catch(() => {}); else if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Gekopieerd'), () => {}); break; }
    case 'logout': sb.auth.signOut(); break;
  }
});
document.addEventListener('input', (e) => {
  const id = e.target.id, f = S.form;
  if (id === 'fZone') f.zone = e.target.value; else if (id === 'fRate') f.rate = e.target.value; else if (id === 'fPlace') f.place = e.target.value; else return;
  const rate = parseEur(f.rate); const btn = $('#startBtn');
  if (btn) btn.disabled = !(f.veh && f.proj && f.zone.trim() && rate !== null && !Number.isNaN(rate)) || S.busy;
});
document.addEventListener('change', (e) => { const v = e.target.dataset && e.target.dataset.driver; if (v) setDriver(v, e.target.value); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

// Lopende klokken
setInterval(() => {
  if (!S.user || S.loading) return;
  const a = mine();
  if (S.tab === 'park' && a) { const d = Date.now() - ms(a.start_at); const t = $('#timer'), c = $('#cost'); if (t) t.textContent = clock(d); if (c) c.textContent = '± ' + eur(est(a.rate, d)); }
  if (S.tab === 'team') document.querySelectorAll('[data-live]').forEach((el) => { const s = S.sessions.find((x) => x.id === el.dataset.live); if (s) el.textContent = eur(est(s.rate, Date.now() - ms(s.start_at))); });
}, 1000);

// ---------- start ----------
sb.auth.onAuthStateChange((_ev, session) => {
  const u = session ? session.user : null;
  const changed = (u && u.id) !== (S.user && S.user.id);
  S.user = u;
  if (!u) { closeSheet(); if (S.channel) { sb.removeChannel(S.channel); S.channel = null; } S.loading = true; S.prefilled = false; S.tab = 'park'; S.form = { veh: null, proj: null, zone: '', rate: '', place: '' }; S.found = null; S.locMsg = ''; S.conflict = null; S.emails = null; S.newMember = null; document.getElementById('root').innerHTML = ''; render(); return; }
  if (changed) { S.loading = true; render(); setTimeout(() => { load(); subscribe(); }, 0); }
});
sb.auth.getSession().then(({ data }) => { if (!data.session) render(); });

})();
</script>
</body>
